<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SHADER_START:ANIMATION_2 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_2" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_2');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;

uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;
varying vec2 v_texCoord;

// Simplex/Perlin-like noise helpers for laminar & turbulent aerodynamic airflow
float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    vec2 shift = vec2(100.0);
    mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
    for (int i = 0; i < 4; ++i) {
        v += a * noise(p);
        p = rot * p * 2.0 + shift;
        a *= 0.5;
    }
    return v;
}

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    
    // Normalized coordinates centered with aspect ratio
    float aspect = u_resolution.x / u_resolution.y;
    vec2 p = uv;
    p.x *= aspect;

    // AC Unit origin (top right / upper right quadrant)
    // Stream jets out from top-right towards bottom-left with natural laminar expansion
    vec2 origin = vec2(aspect * 0.82, 0.88);
    vec2 diff = p - origin;
    
    // Air direction: down and to the left
    float t = u_time * 0.9;
    
    // Flow coordinate system: along stream (s) and transverse (w)
    // Angle ~ -145 degrees (pointing left and slightly downwards)
    float angle = 2.45; // in radians
    vec2 dir = vec2(cos(angle), sin(angle));
    vec2 perp = vec2(-sin(angle), cos(angle));
    
    float s = dot(diff, dir);      // distance along the flow
    float w = dot(diff, perp);     // distance perpendicular to stream
    
    // Stream bounds and expansion
    float streamWidth = 0.18 + 0.35 * max(0.0, s);
    float inStream = smoothstep(0.0, 0.08, s) * (1.0 - smoothstep(0.0, streamWidth, abs(w)));
    
    // Streamlines / ribbon lines calculation
    float lineIntensity = 0.0;
    
    // Multiple laminar stream filaments moving with varying speeds
    for (int i = 0; i < 7; i++) {
        float fi = float(i);
        float offsetW = (fi - 3.0) * 0.055;
        float speed = 1.2 + fi * 0.18;
        
        // Turbulence displacement along line
        float turb = fbm(vec2(s * 1.5 - t * speed * 0.8, fi * 2.1 + t * 0.2)) * 0.06;
        float lineDist = abs(w - offsetW + turb * (0.4 + 0.6 * s));
        
        // Crisp laser-thin luminous streamline with falloff
        float thickness = 0.0035 + 0.002 * s;
        float line = smoothstep(thickness * 4.0, thickness * 0.2, lineDist);
        
        // Pulses along the line representing moving cold air packets
        float pulse = sin(s * 9.0 - t * speed * 3.5 + fi * 1.5) * 0.5 + 0.5;
        pulse = pow(pulse, 2.5);
        
        lineIntensity += line * (0.45 + 0.55 * pulse) * exp(-s * 0.45);
    }
    
    // Atmospheric cold haze / fog volume inside the air jet
    float hazeNoise = fbm(vec2(s * 2.2 - t * 1.4, w * 3.0 + t * 0.15));
    float haze = hazeNoise * smoothstep(streamWidth, 0.0, abs(w)) * smoothstep(0.0, 0.15, s) * exp(-s * 0.65);
    
    // Ambient floating cooling micro-particles
    float particles = 0.0;
    for (int j = 0; j < 3; j++) {
        float fj = float(j);
        vec2 partUV = vec2(p.x * 4.0 + t * (0.3 + fj * 0.2), p.y * 4.0 + sin(t * 0.5 + fj) * 0.2);
        float n = hash(floor(partUV) + fj * 17.13);
        if (n > 0.94) {
            vec2 fpart = fract(partUV) - 0.5;
            float d = length(fpart);
            particles += smoothstep(0.12, 0.0, d) * (sin(t * 2.0 + n * 6.28) * 0.5 + 0.5) * 0.35;
        }
    }
    
    // Sub-vent cyan glow at the mouth of the air conditioner (cold blast origin)
    float ventGlow = smoothstep(0.45, 0.0, length(diff)) * 0.65;
    
    // Luxury color palette: deep dark graphite/obsidian canvas, architectural ice cyan, cold crisp silver-white
    vec3 baseColor = vec3(0.035, 0.047, 0.065); // deep slate/black #090C10
    vec3 glowCyan = vec3(0.22, 0.74, 0.97);     // #38bdf8 crisp cooling cyan
    vec3 frostTeal = vec3(0.35, 0.88, 0.98);    // #5eead4 ice teal
    vec3 coreWhite = vec3(0.95, 0.98, 1.00);    // pristine chilled white core
    
    vec3 finalColor = baseColor;
    
    // Add atmospheric cooling haze
    finalColor += mix(glowCyan, frostTeal, hazeNoise) * haze * 0.55;
    
    // Add radiant streamlines
    vec3 streamColor = mix(glowCyan, coreWhite, lineIntensity * 0.7);
    finalColor += streamColor * lineIntensity * 1.25;
    
    // Add vent glow
    finalColor += glowCyan * ventGlow * 0.45;
    
    // Add particles
    finalColor += frostTeal * particles * 0.4;
    
    // Subtle architectural ambient gradient from bottom-left to top-right
    finalColor += vec3(0.015, 0.025, 0.04) * (1.0 - uv.y);

    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
</div>
<!-- STITCH_SHADER_END:ANIMATION_2 -->
</body>
</html>
