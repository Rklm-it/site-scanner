# Пример конфига. Запуск: python -m scanner --config config.example.yaml
# Любой ключ можно переопределить флагом командной строки.

# --- что искать ---
# Готовые запросы:
queries:
  - стоматология Казань
  - автосервис Казань
# ...или генерация «категория × город» (перемножаются):
categories:
  - натяжные потолки
  - доставка воды
  - ветклиника
cities:
  - Казань
  - Набережные Челны

# --- поиск ---
providers: [yandex, google]   # yandex, google, serpapi_google, serpapi_yandex, duckduckgo
max_per_query: 20

# --- скан ---
concurrency: 8
min_score: 30                 # не включать сайты со «свежим» дизайном
timeout: 12
follow_contact_page: true     # доходить до /контакты за телефонами и ИНН

# --- потолки времени (сек) ---
# Прогон не может идти дольше total_budget: каждая фаза берёт не больше своего
# бюджета и не больше остатка от общего. По истечении бюджета фаза отдаёт то,
# что успела, и пишет предупреждение — скан не зависает на одном пункте.
total_budget: 1800            # весь прогон целиком (30 мин)
collect_budget: 240           # сбор выдачи из поисковиков
# scan_budget: 600            # фаза скана сайтов; по умолчанию — авто от объёма
enrich_budget: 600            # обогащение через DaData/DataNewton

# --- вежливость ---
respect_robots: true
per_host_delay: 1.0           # секунд между запросами к одному домену

# --- обогащение по ИНН (нужен DADATA_TOKEN) ---
enrich: false                 # оборот, статус, руководитель по ИНН

# --- кэш ---
cache_path: cache.sqlite      # null — выключить кэш
cache_pages: false            # кэшировать HTML страниц (может разрастись)
skip_seen: false              # пропускать домены из прошлых прогонов
search_ttl: 86400             # сколько секунд хранить выдачу поиска

# --- вывод ---
out: out/leads                # создаст out/leads.csv и out/leads.json
top: 15                       # показать топ в консоли
